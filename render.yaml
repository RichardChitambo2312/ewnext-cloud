services:
  - type: web
    name: ewnext-cloud
    runtime: python
    plan: free
    rootDir: cloud
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ewnext-db
          property: connectionString
      - key: ROUTER_API_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13"

databases:
  - name: ewnext-db
    plan: free
    databaseName: ewnext
    user: ewnext
