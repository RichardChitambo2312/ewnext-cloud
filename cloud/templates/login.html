<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2980b9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Keyview">
  <title>Keyview Cloud — Sign in</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/brand/icon-180.png">
  <link rel="stylesheet" href="/static/app.css?v=login4">
</head>
<body class="login-body">
  <main class="login-card">
    <img class="login-logo" src="/static/brand/keyview-logo-colour.png" alt="Keyview Intelligent Monitoring">
    {% if notice %}<p class="login-ok">{{ notice }}</p>{% endif %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="text" autocomplete="username" placeholder="admin">
      <label for="password">Password</label>
      <div class="pw-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        {% include "password_eye.html" %}
      </div>
      <p class="login-forgot"><a href="/forgot">Forgot password?</a></p>
      <button class="primary-btn" type="submit">Sign in</button>
    </form>
    <p class="login-switch">New organisation? <a href="/signup">Create an account</a></p>
  </main>
  <script src="/static/password.js?v=login3"></script>
  <script src="/static/push.js?v=push2"></script>
</body>
</html>
