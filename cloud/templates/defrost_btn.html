<form class="defrost-toggle" method="post" action="/defrost">
  <input type="hidden" name="device_id" value="{{ inst.device_id }}">
  <input type="hidden" name="instrument_id" value="{{ inst.instrument_id }}">
  {% if defrost_next %}
  <input type="hidden" name="next" value="{{ defrost_next }}">
  {% endif %}
  <button
    type="submit"
    class="defrost-btn{% if inst.pending_defrost %} is-queued{% endif %}{% if inst.defrost_active %} is-on{% endif %}"
    aria-pressed="{{ 'true' if inst.defrost_active else 'false' }}"
    {% if inst.defrost_active and not inst.pending_defrost %}disabled{% endif %}
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 17.85C8 19.04 7.11 20 6 20s-2-.96-2-2.15C4 16.42 6 14 6 14s2 2.42 2 3.85M16.46 12v-1.44l2-1.13l2.33.62l.52-1.93l-1.77-.47l.46-1.77l-1.93-.52l-.62 2.33l-2 1.13L13 7.38V5.12l1.71-1.71L13.29 2L12 3.29L10.71 2L9.29 3.41L11 5.12v2.26L8.5 8.82l-2-1.13l-.58-2.33L4 5.88l.47 1.77l-1.77.47.52 1.93l2.33-.62l2 1.13V12H2v1h20v-1zM9.5 12v-1.44L12 9.11l2.5 1.45V12zM20 17.85c0 1.19-.89 2.15-2 2.15s-2-.96-2-2.15c0-1.43 2-3.85 2-3.85s2 2.42 2 3.85m-6 3c0 1.19-.89 2.15-2 2.15s-2-.96-2-2.15c0-1.43 2-3.85 2-3.85s2 2.42 2 3.85"/></svg>
    <span class="defrost-btn-label">{% if inst.pending_defrost %}Starting…{% elif inst.defrost_active %}Defrosting{% else %}Manual defrost{% endif %}</span>
  </button>
</form>
