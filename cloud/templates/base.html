<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EWNext Cloud{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <strong class="brand-word">EWNext</strong>
        <span class="sidebar-mini">Cloud</span>
      </div>
      <nav class="sidebar-nav" aria-label="App">
        <a class="side-link{% if page == 'instruments' %} active{% endif %}" href="/">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Instruments</span>
        </a>
        <a class="side-link{% if page == 'jobs' %} active{% endif %}" href="/jobs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6h14M5 12h14M5 18h9" stroke-linecap="round"/></svg>
          <span>Jobs</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <div class="side-user">
          <strong>Admin</strong>
          <span>EWNext Gateway</span>
        </div>
        <form method="post" action="/logout">
          <button class="side-logout" type="submit">Sign out</button>
        </form>
      </div>
    </aside>

    <div class="shell-content">
      <header class="shell-topbar">
        <div class="top-health top-health-{{ health.level }}">
          <span class="top-health-label">{{ health.label }}</span>
          <span>{{ health.detail }}</span>
        </div>
        <div class="top-meta">
          <span class="top-store">{{ online_n }} online · {{ alarm_n }} alarm</span>
        </div>
      </header>

      <main class="shell-main">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script>
    document.querySelectorAll(".setpoint-inline").forEach(function (form) {
      var input = form.querySelector(".setpoint-input");
      var pill = form.querySelector(".setpoint-pill");
      if (!input) return;
      var last = input.value;
      form.addEventListener("submit", function (event) {
        if (!input.checkValidity() || input.value === "" || input.value === last) {
          event.preventDefault();
        }
      });
      function applyLiveSetpoint(live) {
        if (live === null || live === undefined || live === "") return;
        input.value = live;
        last = String(live);
        if (pill) pill.classList.remove("is-queued");
      }
      function closeEnough(a, b) {
        return Math.abs(Number(a) - Number(b)) < 0.051;
      }
      function pullControllerSetpoint(queued) {
        var deviceId = form.querySelector("[name=device_id]").value;
        var instrumentId = form.querySelector("[name=instrument_id]").value;
        return fetch("/api/instruments", {
          credentials: "same-origin",
          headers: { Accept: "application/json" }
        }).then(function (res) {
          if (!res.ok) throw new Error("status failed");
          return res.json();
        }).then(function (rows) {
          var row = (rows || []).find(function (item) {
            return String(item.device_id) === String(deviceId)
              && String(item.instrument_id) === String(instrumentId);
          });
          if (!row) return null;
          if (row.last_setpoint != null && closeEnough(row.last_setpoint, queued)) {
            applyLiveSetpoint(row.last_setpoint);
            return "confirmed";
          }
          return row.last_setpoint;
        });
      }
      input.addEventListener("keydown", function (event) {
        if (event.key !== "Enter") return;
        event.preventDefault();
        if (!input.checkValidity() || input.value === "" || input.value === last) return;
        var next = input.value;
        last = next;
        if (pill) pill.classList.add("is-queued");
        fetch("/setpoint", {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" },
          credentials: "same-origin"
        }).then(function (res) {
          if (!res.ok) throw new Error("queue failed");
          var started = Date.now();
          var timer = setInterval(function () {
            if (document.activeElement === input && input.value !== String(next)) {
              clearInterval(timer);
              return;
            }
            pullControllerSetpoint(next).then(function (result) {
              var timedOut = Date.now() - started >= 10000;
              if (result === "confirmed") {
                clearInterval(timer);
                return;
              }
              if (timedOut) {
                clearInterval(timer);
                if (result != null) applyLiveSetpoint(result);
              }
            }).catch(function () {
              if (Date.now() - started >= 10000) clearInterval(timer);
            });
          }, 2000);
        }).catch(function () {
          last = "";
          if (pill) pill.classList.remove("is-queued");
          input.value = next;
        });
      });
    });
    {% if page != "instrument" %}
    setTimeout(function () {
      var el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT")) return;
      location.reload();
    }, 20000);
    {% endif %}
  </script>
</body>
</html>
